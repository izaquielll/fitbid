<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FIT BID · Venda por lances de equipamentos profissionais</title>
<meta name="description" content="Venda por lances, compra imediata e ofertas de equipamentos profissionais de academia. Venda direta FIT BID.">
<meta name="theme-color" content="#0B0B0C">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23E1251B'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='900'>FB</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#F3F3F1;--surface:#FFFFFF;--surface-2:#F0F0EE;--ink:#0E0F11;--muted:#5E6470;--line:#E2E3E0;
 --black:#0B0B0C;--graphite:#1C1F24;--graphite-2:#2A2E35;--on-dark:#F4F4F2;--on-dark-muted:#A3A9B3;
 --red:#E1251B;--red-hover:#C81E15;--red-soft:rgba(225,37,27,.09);--green:#15803D;--green-soft:rgba(21,128,61,.11);
 --amber:#B45309;--amber-soft:rgba(180,83,9,.12);
 --photo:#FFFFFF;--ill-bg:#ECEDEA;--ill:#2A2E35;
 --shadow:0 1px 2px rgba(0,0,0,.05),0 10px 28px rgba(0,0,0,.06);
 --display:"Archivo","Helvetica Neue",Arial,sans-serif;--body:"Archivo","Segoe UI",Roboto,Arial,sans-serif;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D0E10;--surface:#16181C;--surface-2:#1E2126;--ink:#F2F2F0;--muted:#9BA1AB;--line:#2A2D33;--photo:#F4F4F2;--ill-bg:#23262B;--ill:#C9CDD3;--green:#22C55E;--green-soft:rgba(34,197,94,.14);--red-soft:rgba(225,37,27,.16);--amber:#F59E0B;--shadow:0 1px 2px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0D0E10;--surface:#16181C;--surface-2:#1E2126;--ink:#F2F2F0;--muted:#9BA1AB;--line:#2A2D33;--photo:#F4F4F2;--ill-bg:#23262B;--ill:#C9CDD3;--green:#22C55E;--green-soft:rgba(34,197,94,.14);--red-soft:rgba(225,37,27,.16);--amber:#F59E0B;--shadow:0 1px 2px rgba(0,0,0,.4)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.05;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* demo strip + header */
.demo-strip{background:var(--graphite);color:var(--on-dark-muted);font-size:12px;text-align:center;padding:5px 12px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--black);color:var(--on-dark);border-bottom:1px solid #1f2125}
.top .wrap{display:flex;align-items:center;gap:16px;height:66px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--on-dark);padding:0}
.logo{flex:none;white-space:nowrap}.logo .mk{flex:none}
.money input{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:11px 12px 11px 38px;width:100%}
aside>.box,aside>.bidpanel+.box{margin-top:16px}
.logo .wm{font-family:var(--display);font-weight:900;font-size:26px;letter-spacing:.02em;font-stretch:115%}
.logo .wm b{color:var(--red)}
.logo .mk{width:30px;height:30px;border-radius:7px;background:var(--red);display:grid;place-items:center}
nav.main{display:flex;gap:2px}
nav.main button{background:none;border:0;color:var(--on-dark-muted);font-weight:600;font-size:13.5px;padding:8px 7px;border-radius:7px;white-space:nowrap}
nav.main button:hover,nav.main button[aria-current="true"]{color:#fff;background:#1d1f23}
.top .right{margin-left:auto;display:flex;align-items:center;gap:4px}
.icon-btn{position:relative;background:none;border:0;color:var(--on-dark);width:40px;height:40px;border-radius:9px;display:grid;place-items:center}
.icon-btn:hover{background:#1d1f23}
.icon-btn .cnt{position:absolute;top:3px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.txt-btn{background:none;border:0;color:var(--on-dark);font-weight:600;font-size:14px;padding:8px 10px;border-radius:8px;white-space:nowrap}
.txt-btn:hover{background:#1d1f23}
.burger{display:none}
.top .btn{letter-spacing:.01em;padding:9px 11px}
.top .txt-btn{padding:8px 8px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:12px 18px;font-weight:800;font-size:14px;letter-spacing:.03em;background:var(--red);color:#fff;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--red-hover)}
.btn:disabled{opacity:.4;cursor:not-allowed;background:var(--red)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.dark:hover{opacity:.88}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.line:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.on-dark{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px #3a3e46}
.btn.on-dark:hover{box-shadow:inset 0 0 0 1.5px #fff}
.btn.green{background:var(--green)}
.btn.sm{padding:8px 12px;font-size:12px;border-radius:8px}
.btn.block{width:100%}
.link{background:none;border:0;padding:0;color:var(--red);font-weight:700}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:.06em;padding:4px 8px;border-radius:6px;text-transform:uppercase;white-space:nowrap}
.b-red{background:var(--red);color:#fff}
.b-dark{background:var(--ink);color:var(--bg)}
.b-green{background:var(--green-soft);color:var(--green)}
.b-soft{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.b-amber{background:var(--amber-soft);color:var(--amber)}
.b-ver{background:var(--green-soft);color:var(--green)}
.demo{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.08em;padding:2px 6px;border-radius:4px;border:1px dashed var(--muted);color:var(--muted);text-transform:uppercase}

/* hero */
.hero{background:var(--black);color:var(--on-dark);position:relative;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center;padding-top:56px;padding-bottom:64px}
.hero .eyebrow{color:var(--red);font-weight:800;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.hero h1{font-size:clamp(40px,5.4vw,70px);font-weight:900;font-stretch:108%;margin:14px 0 18px;letter-spacing:-.02em}
.hero h1 span{color:var(--on-dark-muted)}
.hero p{color:var(--on-dark-muted);font-size:18px;max-width:52ch;margin:0 0 26px}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap}
.collage{display:grid;grid-template-columns:1.3fr 1fr;grid-template-rows:1fr 1fr;gap:12px;height:430px}
.collage .t{background:var(--photo);border-radius:14px;display:grid;place-items:center;overflow:hidden;position:relative}
.collage .t:first-child{grid-row:span 2;background:#16181c}
.collage .t img{max-height:92%;max-width:92%;object-fit:contain}
.collage .t:first-child img{max-height:100%;max-width:100%;object-fit:cover;width:100%;height:100%}
.collage .cap{position:absolute;left:10px;bottom:10px;background:rgba(11,11,12,.85);color:#fff;font-size:12px;font-weight:700;padding:5px 9px;border-radius:7px}
.collage .cap b{color:var(--red)}

/* search */
.searchbox{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin-top:-34px;position:relative;z-index:2;border:1px solid var(--line)}
.searchbox form{display:flex;gap:10px;position:relative}
.searchbox input{flex:1;min-width:0;height:54px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface-2);padding:0 18px 0 46px;font-size:17px}
.searchbox .ico{position:absolute;left:16px;top:17px;color:var(--muted);z-index:1;pointer-events:none}
.searchbox .ex{font-size:13px;color:var(--muted);margin:10px 4px 0}
.searchbox .ex button{background:none;border:0;padding:0 2px;color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}

/* sections */
section.blk{padding:46px 0 10px}
.sh{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.sh h2{font-size:clamp(26px,3vw,36px);font-weight:900}
.sh p{margin:6px 0 0;color:var(--muted)}
.cats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 14px;text-align:left;display:flex;flex-direction:column;gap:12px;min-height:118px;transition:border-color .15s,transform .15s}
.cat:hover{border-color:var(--ink);transform:translateY(-2px)}
.cat svg{color:var(--red)}
.cat b{font-family:var(--display);font-size:16px;line-height:1.15}
.cat span{font-size:12px;color:var(--muted);margin-top:auto}

/* lot cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.grid.big{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.lc{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:box-shadow .15s,transform .15s}
.lc:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.lc .md{position:relative;aspect-ratio:4/3;background:var(--photo);display:grid;place-items:center}
.lc .md img{max-width:86%;max-height:86%;object-fit:contain}
.lc .md .ill{width:100%;height:100%}
.lc .tl{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;max-width:75%}
.heart{position:absolute;right:10px;top:10px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#1C1F24;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.heart[aria-pressed="true"]{color:var(--red)}
.heart[aria-pressed="true"] path{fill:currentColor}
.timer{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:14px;color:var(--red);font-variant-numeric:tabular-nums;white-space:nowrap}
.timer.ended{color:var(--muted)}
.timer.soon::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.2}}
.lc .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.lc .lotno{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.lc h3{font-size:19px;font-weight:800;line-height:1.15}
.lc .meta{font-size:13px;color:var(--muted)}
.lc .pr{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:6px}
.lc .pr small{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.lc .pr b{font-family:var(--display);font-size:24px;font-weight:900}
.lc .ft{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:12px;margin-top:auto}
.lc .ft .acts{display:flex;gap:6px}
.big .lc h3{font-size:22px}
.big .lc .pr b{font-size:28px}
.ill-wrap{width:100%;height:100%;background:var(--ill-bg);display:grid;place-items:center;position:relative}
.ill-wrap svg{width:70%;height:70%;color:var(--ill)}
.ill-wrap .il{position:absolute;right:10px;bottom:8px;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.04em}

/* desmobilizacao */
.desmob{background:var(--black);color:var(--on-dark);border-radius:20px;display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.desmob .l{padding:36px;display:flex;flex-direction:column;gap:14px}
.desmob h2{font-size:clamp(28px,3.4vw,44px);font-weight:900}
.desmob .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.desmob .nums div{border:1px solid #2a2d33;border-radius:12px;padding:12px}
.desmob .nums small{display:block;color:var(--on-dark-muted);font-size:12px}
.desmob .nums b{font-family:var(--display);font-size:22px}
.desmob .r{background:var(--ill-bg);min-height:300px}

/* trust */
.trust{display:grid;grid-template-columns:1fr 1.3fr;gap:30px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:32px}
.trust h2{font-size:clamp(26px,3vw,38px);font-weight:900}
.trust ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trust li{display:flex;gap:10px;align-items:center;font-weight:600;padding:12px 14px;border-radius:12px;background:var(--surface-2)}
.trust li i{font-style:normal;color:var(--green);font-weight:900}
.brands-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;text-align:left}
.bcard .bn{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.06em;font-stretch:112%}
.bcard small{color:var(--muted)}
.sellcta{background:var(--red);color:#fff;border-radius:20px;padding:36px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.sellcta h2{font-size:clamp(26px,3.2vw,40px);font-weight:900}
.sellcta p{margin:8px 0 0;opacity:.9}
.sellcta .btn{background:#fff;color:var(--red)}
footer.ft{margin-top:60px;background:var(--black);color:var(--on-dark-muted);padding:34px 0 calc(34px + env(safe-area-inset-bottom,0px));font-size:14px}
footer.ft .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
footer.ft b{color:#fff}
footer.ft button{background:none;border:0;color:var(--on-dark-muted);padding:0 0 0 14px;text-decoration:underline}

/* browse */
.page-h{padding:30px 0 18px}
.page-h h1{font-size:clamp(30px,4vw,48px);font-weight:900}
.page-h p{color:var(--muted);margin:8px 0 0;max-width:70ch}
.browse{display:grid;grid-template-columns:270px 1fr;gap:24px;align-items:start}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 82px);max-height:calc(100vh - 100px);overflow:auto;display:flex;flex-direction:column;gap:16px}
.filters h4{font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.fg label.ck{display:flex;align-items:center;gap:8px;font-size:14px;padding:3px 0}
.fg select,.fg input[type=text],.fg input[type=number]{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:9px 10px;font-size:14px}
.fg .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.toolbar select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 10px}
.fbtn{display:none}
.empty{grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:16px}

/* lot page */
.crumbs{font-size:13px;color:var(--muted);padding:18px 0 10px;display:flex;gap:6px;flex-wrap:wrap}
.crumbs button{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline}
.lotpage{display:grid;grid-template-columns:1.35fr 1fr;gap:26px;align-items:start}
.gal{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.gal .main{aspect-ratio:4/3;background:var(--photo);display:grid;place-items:center;overflow:hidden;position:relative}
.gal .main img{max-width:88%;max-height:88%;object-fit:contain;transition:transform .3s}
.gal .thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px;border-top:1px solid var(--line)}
.gal .thumbs button{aspect-ratio:1;border:2px solid transparent;border-radius:10px;background:var(--photo);overflow:hidden;padding:0;display:grid;place-items:center}
.gal .thumbs button[aria-pressed="true"]{border-color:var(--red)}
.gal .thumbs img{max-width:90%;max-height:90%;object-fit:contain}
.box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.box+.box{margin-top:16px}
.box h3{font-size:20px;font-weight:800;margin-bottom:12px}
.lt h1{font-size:clamp(26px,3vw,38px);font-weight:900;margin:10px 0 8px}
.vers{display:flex;gap:6px;flex-wrap:wrap}
.specs{display:grid;grid-template-columns:repeat(2,1fr);gap:0;margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.specs div{padding:11px 14px;border-bottom:1px solid var(--line)}
.specs div:nth-child(odd){border-right:1px solid var(--line)}
.specs dt{font-size:12px;color:var(--muted);font-weight:600}
.specs dd{margin:2px 0 0;font-weight:700}
.opp{border:2px solid var(--red);border-radius:16px;padding:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;position:relative}
.opp .tag{position:absolute;top:-12px;left:16px}
.opp small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.opp b{font-family:var(--display);font-size:22px;font-weight:900}
.opp .sv b{color:var(--red)}
.bidpanel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 82px);background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.bp-top{background:var(--black);color:var(--on-dark);padding:20px 22px;display:flex;justify-content:space-between;gap:12px;align-items:flex-end}
.bp-top small{display:block;font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--on-dark-muted);text-transform:uppercase}
.bp-top .cur{font-family:var(--display);font-weight:900;font-size:clamp(30px,3.4vw,40px);line-height:1}
.bp-top .timer{font-size:20px;color:#FF4A40}
.bp-top .timer.ended{color:var(--on-dark-muted)}
.bp-body{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.minrow{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.minrow b{font-family:var(--display);font-size:20px}
.flash{background:var(--green-soft);color:var(--green);font-weight:700;padding:10px 12px;border-radius:10px}
.pos{font-weight:700;padding:10px 12px;border-radius:10px}
.pos.win{background:var(--green-soft);color:var(--green)}
.pos.lose{background:var(--red-soft);color:var(--red)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:11px 12px;width:100%}
.field .hint{font-size:12px;color:var(--muted)}
.money{position:relative}
.money span{position:absolute;left:12px;top:11px;color:var(--muted);font-weight:600}
.money input{padding-left:38px}
.autob{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.autob h4{font-size:16px}
.autob p{margin:0;font-size:13px;color:var(--muted)}
.auto-on{border:1.5px solid var(--ink);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.me td{font-weight:700}
.tblw{overflow-x:auto}
.logi{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.comp{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.comp div{background:var(--surface-2);border-radius:10px;padding:10px 12px}

/* panels */
.panel{display:grid;grid-template-columns:240px 1fr;gap:24px;align-items:start;padding-top:24px}

.side button[aria-current="true"]{background:var(--ink);color:var(--bg)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.kpi small{display:block;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.kpi b{font-family:var(--display);font-size:28px;font-weight:900;display:block;margin-top:4px}
.alert{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--red-soft);border:1px solid var(--red);color:var(--ink);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-weight:700}
.ph-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ph-h h1{font-size:clamp(26px,3vw,36px);font-weight:900}
.mini{display:flex;align-items:center;gap:12px}
.mini .th{width:52px;height:52px;border-radius:9px;background:var(--photo);display:grid;place-items:center;overflow:hidden;flex:none;border:1px solid var(--line)}
.mini .th img{max-width:90%;max-height:90%;object-fit:contain}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:700;font-size:14px}

.calc small{color:var(--muted);font-weight:700;font-size:12px}
.calc b{font-family:var(--display);font-size:28px;display:block}

/* sell */
.ways{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}

.form{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}

.types{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.types label{border:1.5px solid var(--line);border-radius:10px;padding:12px;font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center;cursor:pointer;background:var(--surface)}

.drop{border:2px dashed var(--line);border-radius:14px;padding:24px;text-align:center;color:var(--muted);background:var(--surface-2);cursor:pointer;display:block}
.thumbsup{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-top:10px}
.thumbsup img{aspect-ratio:1;object-fit:cover;border-radius:8px;width:100%}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

.success .ok{width:64px;height:64px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:32px;font-weight:900}

/* steps */
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.how .box{position:relative;padding-top:56px}
.how .n{position:absolute;top:16px;left:22px;font-family:var(--display);font-weight:900;font-size:30px;color:var(--red)}
.how h3{font-size:18px;margin-bottom:6px}
.how p{margin:0;color:var(--muted);font-size:14px}
.track{list-style:none;margin:0;padding:0}
.track li{position:relative;padding:0 0 20px 40px;color:var(--muted)}
.track li::before{content:"";position:absolute;left:12px;top:26px;bottom:0;width:2px;background:var(--line)}
.track li:last-child::before{display:none}
.track .d{position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:12px;font-weight:900}
.track li.done{color:var(--ink)}
.track li.done .d{background:var(--green);border-color:var(--green);color:#fff}
.track li.done::before{background:var(--green)}
.track li.now{color:var(--ink);font-weight:800}
.track li.now .d{border-color:var(--red);background:var(--red);color:#fff}
.track small{display:block;font-weight:500;color:var(--muted)}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

.scrim{position:fixed;inset:0;background:rgba(5,5,6,.6);z-index:80;display:none;align-items:center;justify-content:center;padding:16px}

.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:100;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px))}

function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)();[0,.18].forEach((d,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=i?1320:880;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.0001,c.currentTime+d);g.gain.exponentialRampToValueAtTime(.25,c.currentTime+d+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d+.16);o.start(c.currentTime+d);o.stop(c.currentTime+d+.17)})}catch(e){}}

const CAT_GROUP={Cardio:["Esteiras","Bikes","Cardio"],"Musculação":["Musculação","Bancos","Racks","Anilhas","Halteres"]};
function interestMatch(i,l){if(!i.active)return false;const t=(l.title+" "+(l.brand||"")).toLowerCase();
 if(i.keywords&&!t.includes(i.keywords.trim().toLowerCase()))return false;
 if(i.category&&!(i.category===l.category||(CAT_GROUP[i.category]||[]).includes(l.category)))return false;
 if(i.brand&&!(l.brand||"").toLowerCase().includes(i.brand.toLowerCase()))return false;
 if(num(i.max_price)&&price(l)>num(i.max_price))return false;
 if(i.uf&&i.uf!==l.uf)return false;return true}

 try{localStorage.setItem("fitbid-alert-seen",String(Date.now()))}catch(e){}}

function catBtn([c,p]){return `<button class="cat" onclick="V.f=Object.assign(blankF(),{cat:'${c}'});go('browse',{mode:'all',keep:true})"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${p}"/></svg><b>${c}</b><span>${visible().filter(l=>l.status==="active"&&catMatch(l,c)).length} disponíveis</span></button>`}
function renderCategories(){return `<div class="wrap"><div class="page-h"><h1>Categorias</h1></div><div class="cats">${CATS.map(catBtn).join("")}</div></div>`}

/* ===== explorar ===== */
function filtered(){
 const f=V.f,q=f.q.trim().toLowerCase(),eod=new Date(now());eod.setHours(23,59,59,999);
 let r=visible();if(V.mode==="auctions")r=r.filter(isAuction);if(V.mode==="buynow")r=r.filter(l=>!isAuction(l));
 r=r.filter(l=>(!q||[l.title,l.brand,l.category,l.condition,l.description].join(" ").toLowerCase().includes(q))&&catMatch(l,f.cat)&&(!f.brands.length||f.brands.includes(l.brand))&&(!f.uf||l.uf===f.uf)&&(!f.pmin||price(l)>=+f.pmin)&&(!f.pmax||price(l)<=+f.pmax)&&(!f.types.length||f.types.includes(l.type))&&(!f.conds.length||f.conds.includes(l.condition))&&(!f.today||(live(l)&&ts(l.ends_at)<=eod.getTime())));
 const s=f.sort,act=l=>l.status==="active"&&!ended(l)?1:0;
 r.sort(s==="new"?(a,b)=>ts(b.created_at)-ts(a.created_at):s==="low"?(a,b)=>price(a)-price(b):s==="high"?(a,b)=>price(b)-price(a):s==="bids"?(a,b)=>b.bids_count-a.bids_count:(a,b)=>(act(b)-act(a))||((isAuction(a)?ts(a.ends_at):9e15)-(isAuction(b)?ts(b.ends_at):9e15)));
 return r;
}
function renderBrowse(){
 const t=V.mode==="auctions"?["Venda por lances","Lances ao vivo, com cronômetro e histórico transparente."]:V.mode==="buynow"?["Comprar agora","Preço fixo ou faça uma oferta."]:["Resultados",""];
 const f=V.f,brands=[...new Set(visible().map(l=>l.brand).filter(Boolean))].sort();
 const ck=(arr,v,lbl)=>`<label class="ck"><input type="checkbox" ${f[arr].includes(v)?"checked":""} onchange="togF('${arr}','${esc(v)}',this.checked)">${esc(lbl||v)}</label>`;
 return `<div class="wrap"><div class="page-h"><h1>${t[0]}</h1>${t[1]?`<p>${t[1]}</p>`:""}</div>
 <div class="browse"><aside class="filters" id="filters" aria-label="Filtros">
  <div style="display:flex;justify-content:space-between;align-items:center"><h3 style="font-size:20px">Filtros</h3><button class="link" onclick="V.f=Object.assign(blankF(),{sort:V.f.sort});render()">Limpar</button></div>
  <div class="fg"><h4>Buscar</h4><input type="text" value="${esc(f.q)}" placeholder="Equipamento ou marca" oninput="V.f.q=this.value;results()"></div>
  <div class="fg"><h4>Categoria</h4><select onchange="V.f.cat=this.value;results()"><option value="">Todas</option>${CATS.map(([c])=>`<option ${f.cat===c?"selected":""}>${c}</option>`).join("")}</select></div>
  ${brands.length?`<div class="fg"><h4>Marca</h4>${brands.map(b=>ck("brands",b)).join("")}</div>`:""}
  <div class="fg"><h4>Estado</h4><select onchange="V.f.uf=this.value;results()"><option value="">Todos</option>${UF.map(u=>`<option ${f.uf===u?"selected":""}>${u}</option>`).join("")}</select></div>
  <div class="fg"><h4>Preço (R$)</h4><div class="two"><input type="number" min="0" value="${esc(f.pmin)}" placeholder="Mín." aria-label="Preço mínimo" oninput="V.f.pmin=this.value;results()"><input type="number" min="0" value="${esc(f.pmax)}" placeholder="Máx." aria-label="Preço máximo" oninput="V.f.pmax=this.value;results()"></div></div>
  <div class="fg"><h4>Tipo de venda</h4>${Object.entries(typeLabel).map(([k,v])=>ck("types",k,v)).join("")}</div>
  <div class="fg"><h4>Condição</h4>${["Novo","Seminovo","Showroom","Usado","Devolução"].map(c=>ck("conds",c)).join("")}</div>
  <div class="fg"><label class="ck" style="font-weight:700"><input type="checkbox" ${f.today?"checked":""} onchange="V.f.today=this.checked;results()">Encerrando hoje</label></div>
  <button class="btn fbtn" style="position:fixed;left:18px;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px))" onclick="$('#filters').classList.remove('open')">VER RESULTADOS</button>
 </aside>
 <div><div class="toolbar"><div style="display:flex;gap:10px;align-items:center"><button class="btn sm line fbtn" onclick="$('#filters').classList.add('open')">Filtros</button><span class="muted" id="rc"></span></div>
  <label>Ordenar: <select onchange="V.f.sort=this.value;results()">${[["new","Mais recentes"],["low","Menor preço"],["high","Maior preço"],["end","Encerrando primeiro"],["bids","Mais lances"]].map(([k,v])=>`<option value="${k}" ${f.sort===k?"selected":""}>${v}</option>`).join("")}</select></label></div>
  <div class="grid" id="results"></div></div></div></div>`;
}
function togF(arr,v,on){const a=V.f[arr];const i=a.indexOf(v);if(on&&i<0)a.push(v);if(!on&&i>=0)a.splice(i,1);results()}
function results(){const el=$("#results");if(!el)return;const r=filtered();el.innerHTML=r.map(card).join("")||'<div class="empty">Nenhum equipamento encontrado.</div>';$("#rc").textContent=`${r.length} ${r.length===1?"resultado":"resultados"}`}
/* ===== página do lote ===== */
function renderLot(){
 const l=getLot(V.lot);if(!l)return `<div class="wrap"><div class="empty" style="margin-top:30px">Lote não encontrado ou não está mais disponível.<br><button class="btn sm" style="margin-top:12px" onclick="go('home')">VER OUTROS EQUIPAMENTOS</button></div></div>`;
 if(!S.bids[l.id]&&isAuction(l)){loadBids(l.id).then(()=>{const h=$("#hist");if(h)h.innerHTML=histRows(l)})}
 if(!S.questions[l.id]){S.questions[l.id]=[];loadQuestions(l.id)}
 countView(l.id);
 const auc=isAuction(l),[st,sc]=status(l),sv=saving(l),photos=l.photos||[],seller=sellerOf(l),mgr=canManage(l);
 const specs=[["Marca",l.brand],["Condição",l.condition],["Localização",l.city?`${l.city}/${l.uf||""}`:""],["Nota fiscal",l.nf?"Sim":"Não"],["Garantia",l.warranty],["Número do lote","#"+code(l)],["Quantidade",num(l.qty)>1?l.qty+" unidades":"1 unidade"],["Ano",l.year],["Tipo de venda",typeLabel[l.type]],["Peso estimado",l.kg?`${num(l.kg).toLocaleString("pt-BR")} kg`:""]].filter(x=>x[1]);
 const cur=photos[V.img]||photos[0];
 return `<div class="wrap"><div class="crumbs"><button onclick="go('home')">Início</button> / <button onclick="go('browse',{mode:'${auc?"auctions":"buynow"}'})">${auc?"Venda por lances":"Comprar agora"}</button> / <span>Lote #${esc(code(l))}</span></div>
 <div class="lotpage"><div>
  <div class="gal"><div class="main">${cur?`<img src="${esc(cur)}" alt="${esc(l.title)}">`:media(l)}${heart(l)}</div>
   ${photos.length>1?`<div class="thumbs">${photos.map((p,i)=>`<button aria-label="Foto ${i+1}" aria-pressed="${(V.img||0)===i}" onclick="V.img=${i};render(true)"><img src="${esc(p)}" alt=""></button>`).join("")}</div>`:""}</div>
  <div class="box lt" style="margin-top:16px"><div class="vers"><span class="badge ${sc}">${st}</span><span class="badge b-ver">✓ ${seller?"VENDEDOR VERIFICADO":"VENDA DIRETA "+esc(LOJA)}</span>${l.nf?'<span class="badge b-ver">✓ NOTA FISCAL</span>':""}</div>
   <h1>${esc(l.title)}</h1><div class="muted">Lote #${esc(code(l))}${l.brand?" · "+esc(l.brand):""}${l.condition?" · "+esc(l.condition):""}${l.city?` · ${esc(l.city)}/${esc(l.uf||"")}`:""}</div></div>
  ${auc?priceLadder(l):num(l.ref_price)&&sv>0?`<div class="box ladder"><div class="opp"><span class="badge b-red tag">OPORTUNIDADE</span><div><small>Preço de referência</small><b class="num" style="text-decoration:line-through;opacity:.7">${brl(l.ref_price)}</b></div><div><small>Preço</small><b class="num">${brl(price(l))}</b></div><div class="sv"><small>Economia</small><b class="num">${sv}%</b></div></div></div>`:""}
  <div class="box"><h3>Informações do lote</h3><dl class="specs">${specs.map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>${l.description?`<p style="margin:14px 0 0;white-space:pre-line">${esc(l.description)}</p>`:""}</div>
  <div class="box"><h3>LOGÍSTICA</h3><div class="logi"><div><b>${l.logistics==="retirada"?"Retirada por conta do comprador":"Entrega combinada após a compra"}</b><div class="muted" style="font-size:14px">${l.city?`Saída de ${esc(l.city)}/${esc(l.uf||"")}`:""}${l.kg?` · peso estimado ${num(l.kg).toLocaleString("pt-BR")} kg`:""}</div></div><button class="btn line" onclick="openShip(${l.id})">CALCULAR TRANSPORTE</button></div></div>
  <div class="box" id="qbox">${questionsHTML(l)}</div>
  ${auc?`<div class="box"><h3>Histórico de lances</h3><div class="tblw"><table class="tbl"><thead><tr><th>Horário</th><th>Comprador</th><th>Lance</th></tr></thead><tbody id="hist">${histRows(l)}</tbody></table></div><p class="muted" style="font-size:13px;margin:10px 0 0">Compradores identificados apenas por número.</p></div>`:""}
 </div>
 <aside>${auc?bidPanel(l):buyPanel(l)}
  ${mgr?managerBox(l):""}
  <div class="box"><h3 style="font-size:16px">Vendido por</h3><div class="mini"><div class="th" style="background:var(--ink);color:var(--bg);font-family:var(--display);font-weight:900;font-size:20px">${esc((seller?seller.name:LOJA)[0])}</div><div style="flex:1"><b>${esc(seller?seller.name:LOJA)}</b><div style="color:var(--green);font-weight:700;font-size:13px">✓ ${seller?"VENDEDOR VERIFICADO":"VENDA DIRETA"}</div>${seller&&seller.city?`<div class="muted" style="font-size:13px">${esc(seller.city)}${seller.uf?"/"+esc(seller.uf):""}</div>`:""}</div></div>
   ${seller?`<button class="btn line block" style="margin-top:12px" onclick="go('vendor',{vendor:'${seller.id}'})">VER VITRINE DO VENDEDOR</button>`:""}
   <a class="btn line block" style="margin-top:8px" href="${waLink(`Olá! Tenho uma dúvida sobre o lote #${code(l)} – ${l.title} (${lotUrl(l)}).`,waFor(l))}" target="_blank" rel="noopener">PERGUNTAR NO WHATSAPP</a></div>
  <div class="box"><h3 style="font-size:16px">Compartilhar este lote</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn green" style="flex:1" href="${shareWA(l)}" target="_blank" rel="noopener">ENVIAR NO WHATSAPP</a><button class="btn line" style="flex:1" onclick="copyLink(${l.id})">COPIAR LINK</button></div></div>
 </aside></div></div>${mobileBar(l)}`;
}
function priceLadder(l){
 const entry=num(l.start_price),sug=l.type==="auction_buy"?num(l.buy_price):0,ref=num(l.ref_price),cur=l.bids_count?num(l.current_price):entry;
 if(!ref&&!sug)return "";
 const top=Math.max(ref,sug*1.12,cur*1.05,entry*1.2),pos=v=>Math.max(0,Math.min(100,(v-entry)/(top-entry)*100));
 const col=(t,v,extra,st)=>`<div style="flex:1;min-width:110px"><small class="muted" style="font-weight:700;font-size:12px">${t}</small><div class="num" style="font-family:var(--display);font-weight:900;font-size:22px;${st||""}">${brl(v)}</div>${extra||""}</div>`;
 return `<div class="box ladder"><div style="display:flex;gap:12px;flex-wrap:wrap">${col("Lance de entrada",entry)}${sug?col("Preço sugerido",sug,`<small style="color:var(--green);font-weight:700">para fechar agora</small>`,"color:var(--green)"):""}${ref?col("Preço de referência",ref,saving(l)>0?`<small style="color:var(--red);font-weight:700">economia de até ${Math.round((1-entry/ref)*100)}%</small>`:"","text-decoration:line-through;opacity:.65"):""}</div>
  <div style="position:relative;height:42px;margin:18px 6px 4px" aria-hidden="true">
   <div style="position:absolute;left:0;right:0;top:16px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--red),#f59e0b ${sug?pos(sug):70}%,var(--line) ${sug?pos(sug):70}%)"></div>
   ${sug?`<div style="position:absolute;left:${pos(sug)}%;top:8px;width:3px;height:24px;background:var(--green);transform:translateX(-50%)"></div>`:""}
   <div style="position:absolute;left:${pos(cur)}%;top:0;transform:translateX(-50%);text-align:center"><div style="width:18px;height:18px;border-radius:50%;background:var(--ink);border:3px solid var(--red);margin:9px auto 0"></div></div>
  </div><p class="muted" style="font-size:13px;margin:4px 0 0">● ${l.bids_count?"Lance atual":"Lance de entrada"}: <b data-cur="${l.id}">${brl(cur)}</b>${sug?` · a linha verde marca o preço sugerido para fechar`:""}. Valores de referência indicativos.</p></div>`;
}
function managerBox(l){const ended_=l.status==="sold"||(isAuction(l)&&ended(l));
 return `<div class="box"><b>${S.admin&&l.seller_id!==meId()?"Administrador":"Seu lote"}</b><div class="muted" style="font-size:13px;margin:4px 0 10px">👁 ${num(l.views)} visitas · ${l.bids_count||0} lances</div><div style="display:flex;gap:8px;flex-wrap:wrap">
  <button class="btn sm dark" onclick="editLot(${l.id})">EDITAR</button>${ended_?`<button class="btn sm" onclick="askReactivate(${l.id})">REATIVAR</button>`:""}
  <button class="btn sm green" onclick="makeArt(${l.id})">ARTE PARA STATUS</button><button class="btn sm line" onclick="showInterested(${l.id})">INTERESSADOS</button>
  ${isAuction(l)&&l.bids_count?`<button class="btn sm line" onclick="showBidders(${l.id})">${ended_?"SEGUNDA CHANCE":"OFERTANTES"}</button>`:""}
  <button class="btn sm line" onclick="go('${S.admin?"admin":"seller"}',{tab:'lots'})">PAINEL</button></div></div>`}
/* perguntas públicas */
async function loadQuestions(id){const {data}=await sb.from("questions").select("*").eq("lot_id",id).order("created_at",{ascending:false});S.questions[id]=data||[];const q=$("#qbox");if(q&&String(V.lot)===String(id))q.innerHTML=questionsHTML(getLot(id))}
function questionsHTML(l){const qs=S.questions[l.id]||[],mgr=canManage(l);
 return `<h3>Perguntas sobre este lote</h3>${qs.length?qs.map(q=>`<div style="border-bottom:1px solid var(--line);padding:10px 0"><div><b>P:</b> ${esc(q.question)} <span class="muted" style="font-size:12px">· Comprador #${esc(q.alias||"")} · ${hhmm(q.created_at)}</span></div>
  ${q.answer?`<div style="margin-top:6px;padding-left:12px;border-left:3px solid var(--green)"><b>R:</b> ${esc(q.answer)}</div>`:mgr?`<div style="display:flex;gap:8px;margin-top:8px"><input id="ans${q.id}" placeholder="Escreva a resposta" style="flex:1;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px"><button class="btn sm" onclick="answerQ(${q.id},${l.id})">RESPONDER</button></div>`:`<div class="muted" style="font-size:13px;margin-top:4px">Aguardando resposta do vendedor.</div>`}</div>`).join(""):`<p class="muted" style="margin:0 0 8px">Nenhuma pergunta ainda. As respostas ficam visíveis para todos.</p>`}
  ${l.status==="active"&&!mgr?`<div class="field" style="margin-top:12px"><label for="qtext">Faça uma pergunta pública</label><textarea id="qtext" rows="2" placeholder="Ex.: Aceita retirada em outra cidade?"></textarea></div><button class="btn sm line" style="margin-top:8px" onclick="askQ(${l.id})">ENVIAR PERGUNTA</button>`:""}`}
async function askQ(id){const t=($("#qtext")&&$("#qtext").value||"").trim();if(t.length<3){toast("Escreva sua pergunta.","red");return}if(!await ensureBuyer())return;
 const {error}=await sb.from("questions").insert({lot_id:id,question:t});if(error){toast(errMsg(error),"red");return}toast("Pergunta enviada. O vendedor foi avisado.","green");loadQuestions(id)}
async function answerQ(qid,lid){const t=($("#ans"+qid)&&$("#ans"+qid).value||"").trim();if(!t){toast("Escreva a resposta.","red");return}
 const {error}=await sb.from("questions").update({answer:t}).eq("id",qid);if(error){toast(errMsg(error),"red");return}toast("Resposta publicada.","green");await loadQuestions(lid);if(isSeller())loadSellerData().then(()=>{if(V.view==="seller")render(true)})}
function countView(id){try{if(sessionStorage.getItem("fv"+id))return;sessionStorage.setItem("fv"+id,"1")}catch(e){}if(sb)sb.rpc("lot_view",{p_lot:id}).then(()=>{},()=>{})}
/* interessados e segunda chance */
async function showInterested(id){const l=getLot(id);const {data,error}=await sb.rpc("lot_interested",{p_lot:id});if(error){toast(errMsg(error),"red");return}
 const rows=data||[];openModal(`<h2>Compradores interessados</h2><p class="muted" style="margin:0">Pessoas com alerta compatível com este lote e que aceitaram receber ofertas.</p>
 ${rows.length?rows.map(r=>`<div class="mini" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:10px 0"><div><b>${esc(r.name)}</b><div class="muted" style="font-size:12px">Procura: ${esc(r.what||"")}</div></div><a class="btn sm green" target="_blank" rel="noopener" href="${waLink(`Olá, ${r.name}! Aqui é ${sellerOf(l)?sellerOf(l).name:"da "+LOJA}. Entrou um equipamento que você procura:\n\n${shareText(l)}`,r.whatsapp)}">WHATSAPP</a></div>`).join(""):`<div class="empty">Ainda não há alertas compatíveis com este lote. Divulgue com o botão ARTE PARA STATUS e pelo WhatsApp.</div>`}`)}
async function showBidders(id){const l=getLot(id);const {data,error}=await sb.rpc("lot_bidders",{p_lot:id});if(error){toast(errMsg(error),"red");return}const rows=data||[],ended_=ended(l)||l.status==="sold";
 openModal(`<h2>${ended_?"Segunda chance":"Ofertantes"}</h2><p class="muted" style="margin:0">${ended_?"Se o vencedor desistir, ofereça o equipamento a quem também deu lance.":"Maiores lances neste lote."}</p>
 ${rows.map((r,i)=>`<div class="mini" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:10px 0"><div><b>${i+1}º · ${esc(r.name)}</b><div class="muted" style="font-size:12px">Maior lance: ${brl(r.max_bid)}${r.is_leader?" · vencedor":""}</div></div><a class="btn sm ${r.is_leader?"line":"green"}" target="_blank" rel="noopener" href="${waLink(r.is_leader?`Olá, ${r.name}! Você venceu o lote #${code(l)} – ${l.title} por ${brl(l.current_price)}. Vamos combinar pagamento e entrega?`:`Olá, ${r.name}! O lote #${code(l)} – ${l.title} ficou disponível novamente. Posso te oferecer pelo seu lance de ${brl(r.max_bid)}. Tem interesse?`,r.whatsapp)}">${r.is_leader?"CONTATAR":"OFERECER"}</a></div>`).join("")||'<div class="empty">Sem lances.</div>'}`)}
function histRows(l){const b=S.bids[l.id];if(!b)return '<tr><td colspan="3" class="muted">Carregando…</td></tr>';return b.map(x=>`<tr class="${x.user_id===meId()?"me":""}"><td class="num">${hhmm(x.created_at)}</td><td>${x.user_id===meId()?"Você (Comprador #"+x.alias+")":"Comprador #"+esc(x.alias)}${x.auto?' <span class="muted" style="font-size:12px">(auto)</span>':""}</td><td class="num">${brl(x.amount)}</td></tr>`).join("")||'<tr><td colspan="3" class="muted">Nenhum lance ainda. Seja o primeiro.</td></tr>'}
function bidPanel(l){
 const lv=live(l),mn=minBid(l),auto=S.autos[l.id],ord=S.orders.find(o=>o.lot_id===l.id);
 const pos=iBid(l)||iLead(l)?(iLead(l)?(lv?`<div class="pos win">Você está na frente.</div>`:won(l)?`<div class="pos win">Você venceu este lote!</div>`:`<div class="pos lose">Disputa encerrada sem atingir o valor mínimo de venda.</div>`):(lv?`<div class="pos lose">Você foi superado. Dê um novo lance.</div>`:`<div class="pos lose">Disputa encerrada. Outro comprador venceu.</div>`)):"";
 let body="";
 if(l.status==="sold")body=iLead(l)||ord?`<button class="btn block green" onclick="finishWA(${l.id})">FINALIZAR PELO WHATSAPP</button>`:`<p style="margin:0;font-weight:700">Equipamento vendido.</p>`;
 else if(lv)body=`<div class="minrow"><span>${l.bids_count?"Próximo lance mínimo":"Lance de entrada"}</span><b class="num" data-min="${l.id}">${brl2(mn)}</b></div>
  ${iLead(l)?"":`<div class="field"><label for="bidv">Seu lance (opcional, acima do mínimo)</label><div class="money"><span>R$</span><input id="bidv" class="num" inputmode="decimal" placeholder="${Math.round(mn).toLocaleString("pt-BR")}"></div></div>
  <button class="btn block" style="padding:16px;font-size:16px" onclick="askBid(${l.id})">DAR LANCE</button>`}
  ${l.type==="auction_buy"&&l.buy_price?`<button class="btn block green" onclick="buyNow(${l.id})">FECHAR AGORA POR ${brl(l.buy_price)}</button><p class="muted" style="font-size:12px;margin:-6px 0 0;text-align:center">Preço sugerido: garante o equipamento sem esperar a disputa.</p>`:""}
  <div class="autob"><h4>Definir lance máximo</h4><p>Informe o valor máximo que você aceita pagar. A plataforma cobre outros lances por você, sempre com o mínimo necessário, até esse limite.</p>
  ${auto?`<div class="auto-on"><div><small class="muted">Lance automático até</small><div style="font-family:var(--display);font-weight:900;font-size:22px">${brl(auto)}</div></div><button class="btn sm line" onclick="cancelAuto(${l.id})">CANCELAR</button></div>`:`<div class="money"><span>R$</span><input id="autov" class="num" inputmode="decimal" placeholder="______" aria-label="Lance máximo"></div><button class="btn block line" onclick="askAuto(${l.id})">DEFINIR AUTO-LANCE</button>`}</div>
  <p class="muted" style="font-size:12px;margin:0">Lances são compromissos de compra. Lances nos 2 minutos finais estendem a disputa em 2 minutos.</p>`;
 else if(!started(l))body=`<p class="muted" style="margin:0">Os lances começam em ${new Date(l.starts_at).toLocaleString("pt-BR")}.</p>`;
 else body=`<p style="margin:0;font-weight:700">Disputa encerrada.</p>${iLead(l)&&won(l)?`<button class="btn block green" onclick="finishWA(${l.id})">FINALIZAR PELO WHATSAPP</button>`:""}<button class="btn block line" onclick="go('browse',{mode:'auctions'})">VER OUTROS LOTES</button>`;
 return `<div class="bidpanel"><div class="bp-top"><div><small>${l.bids_count?"Lance atual":"Lance de entrada"}</small><div class="cur num" data-cur2="${l.id}">${brl2(l.bids_count?l.current_price:l.start_price)}</div><small style="margin-top:6px" data-nb2="${l.id}">${l.bids_count} lances</small></div><div style="text-align:right"><small>${lv?"Encerra em":"Status"}</small>${timerEl(l)}</div></div><div class="bp-body">${pos}${body}</div></div>`;
}
function buyPanel(l){
 const mine=l.status==="sold"&&l.sold_to===meId(),acc=S.offers.find(o=>o.lot_id===l.id&&["aceita","contraproposta"].includes(o.status));
 return `<div class="bidpanel"><div class="bp-top"><div><small>${l.type==="offer"?"Preço anunciado":"Preço"}</small><div class="cur num">${brl2(l.buy_price)}</div></div><div style="text-align:right"><small>Modalidade</small><b style="color:#fff">${typeLabel[l.type]}</b></div></div>
 <div class="bp-body">${l.status==="sold"?(mine?`<div class="pos win">Você comprou este equipamento.</div><button class="btn block green" onclick="finishWA(${l.id})">FINALIZAR PELO WHATSAPP</button>`:`<p style="margin:0;font-weight:700">Equipamento vendido.</p>`)
 :acc?`<div class="pos win">Sua oferta ${acc.status==="aceita"?"foi aceita":"recebeu contraproposta de "+brl(acc.counter)}.</div><button class="btn block green" onclick="finishWA(${l.id})">FECHAR PELO WHATSAPP</button>`
 :`${l.type==="buy"?`<button class="btn block" style="padding:16px;font-size:16px" onclick="buyNow(${l.id})">COMPRAR AGORA</button>`:""}<button class="btn block ${l.type==="buy"?"line":""}" style="padding:14px" onclick="openOffer(${l.id})">FAZER OFERTA</button><p class="muted" style="font-size:13px;margin:0">Pagamento e entrega são combinados diretamente com ${esc(sellerOf(l)?sellerOf(l).name:"a "+LOJA)} pelo WhatsApp.</p>`}</div></div>`;

function mobileBar(l){
 if(live(l)&&!iLead(l))return `<div class="mbar"><div><small>Lance atual · ${timerEl(l)}</small><b class="num" data-cur="${l.id}">${brl(price(l))}</b></div><button class="btn" onclick="document.getElementById('bidv')?document.getElementById('bidv').scrollIntoView({block:'center'}):askBid(${l.id})">DAR LANCE</button></div>`;
 if(!isAuction(l)&&l.status==="active")return `<div class="mbar"><div><small>${typeLabel[l.type]}</small><b class="num">${brl(l.buy_price)}</b></div><button class="btn" onclick="${l.type==="buy"?`buyNow(${l.id})`:`openOffer(${l.id})`}">${l.type==="buy"?"COMPRAR":"FAZER OFERTA"}</button></div>`;
 return "";
}

/* ===== links e compartilhamento ===== */
function lotUrl(l){return location.origin+location.pathname+"?lote="+l.id}
function vendorUrl(id){return location.origin+location.pathname+"?vendedor="+id}
function shareText(l){const auc=isAuction(l);let t=`🔥 *${l.title}*`+(l.condition?` (${l.condition})`:"")+"\n";
 if(auc){t+=`${l.bids_count?"Lance atual":"Lance de entrada"}: *${brl(price(l))}*`;if(num(l.ref_price))t+=` (referência ${brl(l.ref_price)})`;t+="\n";if(l.type==="auction_buy"&&l.buy_price)t+=`✅ Preço sugerido para fechar agora: ${brl(l.buy_price)}\n`;if(live(l))t+=`⏰ Encerra em ${fmt(ts(l.ends_at)-now()).replace(/ \d+s$/,"")}\n`}
 else{t+=`Preço: *${brl(l.buy_price)}*`+(num(l.ref_price)?` (referência ${brl(l.ref_price)})`:"")+"\n"+(l.type==="offer"?"Aceita ofertas\n":"")}
 return t+`\nVeja fotos e detalhes: ${lotUrl(l)}`}
function siteUrl(){return location.origin+location.pathname}
function vitrineText(){const act=S.lots.filter(l=>l.status==="active"&&(!isAuction(l)||live(l)||!started(l)));let t=`🔥 *FIT BID* · equipamentos profissionais com lances, preço fixo e ofertas\n\n`;
 act.slice(0,15).forEach(l=>{t+=`• *${l.title}* – ${isAuction(l)?(l.bids_count?"lance atual ":"lance de entrada ")+brl(price(l)):brl(l.buy_price)}\n${lotUrl(l)}\n\n`});
 return t+`Veja todos os equipamentos: ${siteUrl()}`}
function shareSiteWA(){return `https://wa.me/?text=${encodeURIComponent(vitrineText())}`}
async function copySite(){try{await navigator.clipboard.writeText(vitrineText());toast("Vitrine copiada. É só colar no WhatsApp.","green")}catch(e){prompt("Copie o link:",siteUrl())}}
function shareWA(l){return `https://wa.me/?text=${encodeURIComponent(shareText(l))}`}
async function copyLink(id){const l=getLot(id);try{await navigator.clipboard.writeText(shareText(l));toast("Texto e link copiados. É só colar no WhatsApp.","green")}catch(e){prompt("Copie o link:",lotUrl(l))}}
function routeFromHash(){const q=new URLSearchParams(location.search);
 if(q.get("lote")){V.view="lot";V.lot=+q.get("lote");return true}
 if(q.get("vendedor")){V.view="vendor";V.vendor=q.get("vendedor");return true}
 if(q.get("vender")!==null){V.view="join";return true}
 const m=location.hash.match(/^#lote-(\d+)/);if(m){V.view="lot";V.lot=+m[1];return true}return false}
window.addEventListener("popstate",()=>{if(!routeFromHash()&&(V.view==="lot"||V.view==="vendor"))V.view="home";closeModal(true);render()});
/* ===== modais ===== */
function openModal(h,onClose){V.modalClose=onClose||null;$("#scrim").innerHTML=`<div class="modal" role="dialog" aria-modal="true"><button class="x" aria-label="Fechar" onclick="closeModal()">✕</button>${h}</div>`;$("#scrim").classList.add("open");const f=$("#scrim .modal input,#scrim .modal .btn");f&&f.focus()}
function closeModal(silent){$("#scrim").classList.remove("open");const c=V.modalClose;V.modalClose=null;if(!silent&&c)c()}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();closeDrawer();$("#filters")&&$("#filters").classList.remove("open")}});
function busyBtn(b,on){if(!b)return;b.disabled=on;if(on){b.dataset.t=b.textContent;b.textContent="AGUARDE…"}else if(b.dataset.t)b.textContent=b.dataset.t}

async function askBid(id){const l=getLot(id);const inp=$("#bidv");const typed=parseMoney(inp&&inp.value);if(!await ensureBuyer())return;const mn=minBid(l);const v=typed||mn;
 if(!live(l)){toast("Esta disputa está encerrada.","red");return}if(v<mn){toast(`O lance mínimo é ${brl2(mn)}.`,"red");return}
 openModal(`<h2>Confirmar lance</h2><p style="margin:0;font-size:17px">Você está oferecendo <b class="num">${brl2(v)}</b> neste lote.</p><div class="sumrow"><span>Lote</span><span>#${esc(code(l))}</span><span>Equipamento</span><span style="text-align:right">${esc(l.title)}</span></div><p class="muted" style="font-size:13px;margin:0">O lance é um compromisso de compra caso você vença.</p><div class="acts"><button class="btn line" onclick="closeModal()">CANCELAR</button><button class="btn" id="cb" onclick="placeBid(${id},${v})">CONFIRMAR LANCE</button></div>`)}
async function placeBid(id,v){const b=$("#cb");busyBtn(b,true);const {data,error}=await sb.rpc("place_bid",{p_lot:id,p_amount:v});busyBtn(b,false);
 if(error){toast(errMsg(error),"red");return}closeModal();mergeLot(data);S.myBidLots.add(id);await loadBids(id);toast(iLead(getLot(id))?"✓ Lance registrado. Você está na frente.":"Lance registrado, mas outro comprador tinha lance automático maior.",iLead(getLot(id))?"green":"red");render(true)}
async function askAuto(id){const l=getLot(id);const v=parseMoney($("#autov")&&$("#autov").value);if(!await ensureBuyer())return;const mn=minBid(l);if(!v||(v<mn&&!iLead(l))){toast(`Informe um valor a partir de ${brl2(mn)}.`,"red");return}
 openModal(`<h2>Definir lance automático</h2><p style="margin:0">A plataforma dará lances por você, sempre o mínimo necessário, até <b>${brl2(v)}</b>. Ninguém vê o seu limite.</p><div class="sumrow"><span>Lance atual</span><span class="num">${brl(price(l))}</span><span>${iLead(l)?"Você já lidera":"Seu primeiro lance agora"}</span><span class="num">${iLead(l)?"—":brl(Math.min(v,mn))}</span></div><div class="acts"><button class="btn line" onclick="closeModal()">CANCELAR</button><button class="btn" id="cb" onclick="setAuto(${id},${v})">CONFIRMAR</button></div>`)}
async function setAuto(id,v){const b=$("#cb");busyBtn(b,true);const {data,error}=await sb.rpc("set_autobid",{p_lot:id,p_max:v});busyBtn(b,false);if(error){toast(errMsg(error),"red");return}closeModal();mergeLot(data);S.autos[id]=v;S.myBidLots.add(id);await loadBids(id);toast(iLead(getLot(id))?"Lance automático ativo. Você está na frente.":"Lance automático ativo, mas outro comprador tem limite maior.",iLead(getLot(id))?"green":"red");render(true)}
async function cancelAuto(id){const {error}=await sb.rpc("cancel_autobid",{p_lot:id});if(error){toast(errMsg(error),"red");return}delete S.autos[id];toast("Lance automático cancelado.");render(true)}
function mergeLot(n){if(!n)return;const i=S.lots.findIndex(l=>l.id===n.id);if(i>=0)S.lots[i]=n;else S.lots.unshift(n)}

function shipFields(l){return `<div class="field"><label>Entrega</label>${Object.entries(SHIP).map(([k,v],i)=>`<label class="ck" style="display:flex;gap:10px;align-items:center;padding:6px 0"><input type="radio" name="shp" value="${k}" ${(l.logistics==="retirada"?k==="retirada":i===1)?"checked":""}> ${v}</label>`).join("")}</div><div class="field"><label for="shcep">CEP de entrega (se não for retirar)</label><input id="shcep" inputmode="numeric" placeholder="00000-000" oninput="this.value=maskCep(this.value)"></div>`}
function readShip(){const k=(document.querySelector('input[name="shp"]:checked')||{}).value||"retirada";const c=$("#shcep")?$("#shcep").value:"";return SHIP[k]+(k!=="retirada"&&c?` · CEP ${c}`:"")}
async function buyNow(id){const l=getLot(id);if(!await ensureBuyer())return;if(l.status!=="active"||(isAuction(l)&&!live(l))){toast("Este equipamento não está mais disponível.","red");return}
 openModal(`<h2>Comprar agora</h2><p style="margin:0">${esc(l.title)} · Lote #${esc(code(l))}</p><div class="sumrow"><span>Preço</span><b class="num">${brl2(l.buy_price)}</b></div>${shipFields(l)}<p class="muted" style="font-size:13px;margin:0">Ao confirmar, o equipamento fica reservado para você e abrimos o WhatsApp para combinar pagamento e entrega.</p><div class="acts"><button class="btn line" onclick="closeModal()">CANCELAR</button><button class="btn" id="cb" onclick="confirmBuy(${id})">CONFIRMAR COMPRA</button></div>`)}
async function confirmBuy(id){const ship=readShip(),b=$("#cb");busyBtn(b,true);const {data,error}=await sb.rpc("buy_now",{p_lot:id,p_shipping:ship});busyBtn(b,false);if(error){toast(errMsg(error),"red");return}
 const l=getLot(id);l.status="sold";l.sold_to=meId();await loadMine();notify(`Compra reservada: ${l.title}.`,id);waDone(l,"compra",l.buy_price,ship,data)}
async function finishWA(id){const l=getLot(id);if(!await ensureBuyer())return;const ord=S.orders.find(o=>o.lot_id===id);
 if(ord){waDone(l,ord.kind,ord.amount,ord.shipping||"a combinar",ord.id);return}
 openModal(`<h2>Finalizar compra</h2><p style="margin:0">${esc(l.title)} · Lote #${esc(code(l))}</p>${shipFields(l)}<div class="acts"><button class="btn line" onclick="closeModal()">CANCELAR</button><button class="btn green" id="cb" onclick="confirmClaim(${id})">CONTINUAR</button></div>`)}
async function confirmClaim(id){const ship=readShip(),b=$("#cb");busyBtn(b,true);const {data,error}=await sb.rpc("claim_order",{p_lot:id,p_shipping:ship});busyBtn(b,false);if(error){toast(errMsg(error),"red");return}await loadMine();await loadLots();const o=S.orders.find(x=>x.id===data)||{kind:"leilao",amount:getLot(id).current_price};waDone(getLot(id),o.kind,o.amount,ship,data)}
function waDone(l,kind,amount,ship,orderId){
 const k={leilao:"venda por lances (oferta vencedora)",compra:"compra imediata",oferta:"oferta aceita"}[kind]||kind;
 const msg=`Olá! Sou ${S.profile.name} (Comprador #${S.profile.alias}).\nQuero finalizar a compra:\n• Lote #${code(l)} – ${l.title}\n• Valor: ${brl2(amount)}\n• Modalidade: ${k}\n• Entrega: ${ship}\n• Pedido nº ${orderId}`;
 openModal(`<div class="success"><div class="ok">✓</div><h2 style="padding:0">Pedido nº ${orderId} registrado</h2><p class="muted" style="margin:0">Agora é só abrir o WhatsApp e enviar a mensagem pronta para combinar pagamento e entrega.</p><a class="btn green block" href="${waLink(msg,waFor(l))}" target="_blank" rel="noopener">ABRIR WHATSAPP ${sellerOf(l)?"DO VENDEDOR":""}</a>${sellerOf(l)?`<p class="muted" style="font-size:13px;margin:0">Você vai falar com <b>${esc(sellerOf(l).name)}</b>, vendedor verificado.</p>`:""}<button class="btn line" onclick="closeModal()">FECHAR</button></div>`);render(true)}

async function openOffer(id){const l=getLot(id);if(!await ensureBuyer())return;openModal(`<h2>Faça uma oferta</h2><div class="sumrow"><span>Preço anunciado</span><b class="num">${brl2(l.buy_price)}</b></div>
 <div class="field"><label for="ofv">Minha oferta</label><div class="money"><span>R$</span><input id="ofv" class="num" inputmode="decimal"></div></div>
 <div class="field"><label for="ofm">Mensagem (opcional)</label><textarea id="ofm" rows="3" placeholder="Ex.: retiro na próxima semana"></textarea></div><button class="btn block" id="cb" onclick="sendOffer(${id})">ENVIAR OFERTA</button>`)}
async function sendOffer(id){const v=parseMoney($("#ofv").value);if(!v){toast("Informe o valor da oferta.","red");return}const b=$("#cb");busyBtn(b,true);
 const {data,error}=await sb.from("offers").insert({lot_id:id,amount:v,message:$("#ofm").value.trim()||null}).select().single();busyBtn(b,false);if(error){toast(errMsg(error),"red");return}
 S.offers.unshift(data);$("#scrim .modal").innerHTML=`<div class="success"><div class="ok">✓</div><h2 style="padding:0">Oferta enviada.</h2><p class="muted" style="margin:0">Você ofereceu ${brl2(v)}. A resposta aparece em Minha conta → Ofertas.</p><button class="btn dark" onclick="closeModal()">FECHAR</button></div>`}

/* transporte (estimativa) */
const REG={0:[-23.5,-46.6],1:[-22.9,-47.1],2:[-22.9,-43.2],3:[-19.9,-43.9],4:[-12.9,-38.5],5:[-8.05,-34.9],6:[-3.7,-38.5],7:[-15.8,-47.9],8:[-25.4,-49.3],9:[-30,-51.2]};
const UF_CEP={SP:"01310000",RJ:"20040000",MG:"30140000",ES:"29010000",PR:"80010000",SC:"88010000",RS:"90010000",GO:"74003000",DF:"70040000",BA:"40020000",PE:"50030000",CE:"60060000"};
const maskCep=v=>{v=v.replace(/\D/g,"").slice(0,8);return v.length>5?v.slice(0,5)+"-"+v.slice(5):v};
function km(a,b){const[p,q]=REG[a],[r,s]=REG[b],R=Math.PI/180;return Math.max(30,Math.acos(Math.min(1,Math.sin(p*R)*Math.sin(r*R)+Math.cos(p*R)*Math.cos(r*R)*Math.cos((q-s)*R)))*6371*1.25)}
function openShip(id){const l=getLot(id);openModal(`<h2>Calcular transporte</h2><div class="form" style="grid-template-columns:1fr 1fr"><div class="field"><label for="c1">CEP origem</label><input id="c1" inputmode="numeric" value="${maskCep(UF_CEP[l.uf]||"20040000")}" oninput="this.value=maskCep(this.value)"></div><div class="field"><label for="c2">CEP destino</label><input id="c2" inputmode="numeric" placeholder="00000-000" oninput="this.value=maskCep(this.value)"></div>

function resizeImage(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(new Error("Imagem inválida")),"image/jpeg",.82)};img.onerror=()=>rej(new Error("Imagem inválida"));img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

 if(miss.length){toast("Preencha: "+miss.join(", ")+".","red");return}

  start_price:auc?num(e.start_price):null,increment:auc?num(e.increment):null,buy_price:e.type!=="auction"?num(e.buy_price):null,starts_at:auc?e.starts_at||null:null,ends_at:auc?e.ends_at:null,description:e.description||null,nf:!!e.nf,warranty:e.warranty||null,logistics:e.logistics||"cotacao",photos:e.photos,wa_override:onlyDigits(e.wa_override)||null};if(S.admin)row.featured=!!e.featured;

 if(res.error){busyBtn(b,false);toast(errMsg(res.error),"red");return}
 let lot=res.data;if(!lot.code&&S.admin){const r2=await sb.from("lots").update({code:String(lot.id).padStart(3,"0")}).eq("id",lot.id).select().single();if(r2.data)lot=r2.data}

 S.adm.privates[lot.id]=pr;const r4=await sb.from("lots").select("*").eq("id",lot.id).single();mergeLot(r4.data||lot);V.edit=null;if(isSeller()&&!S.admin)loadSellerData();toast(e.id?"Lote atualizado.":"Lote publicado! Use ARTE PARA STATUS e INTERESSADOS para divulgar.","green");go("lot",{lot:lot.id})}

function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function wrap(x,t,a,b,w,lh,max){const ws=String(t).split(" ");let line="",n=0,y=b;for(const wd of ws){const tt=line?line+" "+wd:wd;if(x.measureText(tt).width>w&&line){x.fillText(line,a,y);y+=lh;n++;line=wd;if(n>=max-1){line=ws.slice(ws.indexOf(wd)).join(" ");while(x.measureText(line+"…").width>w&&line.length>3)line=line.slice(0,-1);if(line!==ws.slice(ws.indexOf(wd)).join(" "))line+="…";break}}else line=tt}x.fillText(line,a,y);return y+lh/2}

 const d=document.querySelector('meta[name="description"]');if(d)d.setAttribute("content",l?`${l.title}${l.condition?" ("+l.condition+")":""}${l.city?" em "+l.city+"/"+(l.uf||""):""}. ${l.description?l.description.slice(0,120):"Equipamento profissional com lances, preço sugerido e oferta."}`:"Venda por lances, preço fixo e ofertas de equipamentos profissionais de academia.")}
function render(keep){const y=scrollY;renderHeader();
 if(!sb){$("#app").innerHTML=setupScreen();return}
 if(!S.loaded){$("#app").innerHTML=`<div class="wrap"><div class="empty" style="margin-top:40px">Carregando…</div></div>`;return}
 const r={home:renderHome,browse:renderBrowse,lot:renderLot,categories:renderCategories,account:renderAccount,admin:renderAdmin,how:renderHow,join:renderJoin,seller:renderSeller,vendor:renderVendor}[V.view]||renderHome;$("#app").innerHTML=r();setMeta();
 if(V.view==="browse")results();document.body.classList.toggle("has-mbar",!!$("#app .mbar"));if(keep)scrollTo(0,y)}
function busy(){const a=document.activeElement;return a&&["INPUT","TEXTAREA","SELECT"].includes(a.tagName)&&$("#app").contains(a)||$("#scrim").classList.contains("open")||V.view==="admin"&&V.tab==="edit"}
let softT;function softRender(){clearTimeout(softT);softT=setTimeout(()=>{if(!busy())render(true)},250)}
function refreshLot(l){
 document.querySelectorAll(`[data-cur="${l.id}"]`).forEach(e=>e.textContent=brl(price(l)));document.querySelectorAll(`[data-cur2="${l.id}"]`).forEach(e=>e.textContent=brl2(l.bids_count?l.current_price:l.start_price));
 document.querySelectorAll(`[data-nb="${l.id}"]`).forEach(e=>e.textContent=l.bids_count+(e.closest(".tbl")?"":" lances"));document.querySelectorAll(`[data-nb2="${l.id}"]`).forEach(e=>e.textContent=l.bids_count+" lances");
 document.querySelectorAll(`[data-min="${l.id}"]`).forEach(e=>e.textContent=brl2(minBid(l)));
 softRender();
}
const doneSet=new Set();
function tick(){const t=now();
 document.querySelectorAll("[data-end]").forEach(el=>{const l=getLot(el.dataset.end);if(!l)return;const ms=ts(l.ends_at)-t;el.textContent=fmt(ms);el.classList.toggle("ended",ms<=0);el.classList.toggle("soon",ms>0&&ms<H)});
 S.lots.forEach(l=>{if(!isAuction(l)||!l.ends_at)return;const e=ts(l.ends_at)<=t;if(e&&!doneSet.has(l.id)){doneSet.add(l.id);if(S.loaded&&Date.now()-loadedAt>3000){if(iLead(l)&&won(l)){notify(`Você venceu o lote #${code(l)}! Finalize pelo WhatsApp.`,l.id);toast(`Você venceu o lote #${code(l)}!`,"green",l.id)}softRender()}}if(!e)doneSet.delete(l.id)});
}
function setupScreen(){return `<div class="wrap" style="max-width:720px"><div class="box" style="margin-top:30px"><h1 style="font-size:28px;font-weight:900">Quase pronto</h1><p>O site ainda não está conectado ao banco de dados. Abra o arquivo <b>config.js</b> e preencha <b>supabaseUrl</b> e <b>supabaseAnonKey</b> com os dados do seu projeto Supabase, como explicado no guia de instalação.</p>${!window.supabase?'<p class="muted">Também não foi possível carregar a biblioteca do Supabase. Verifique a conexão com a internet.</p>':""}</div></div>`}
let loadedAt=0;
async function init(){routeFromHash();render();if(!sb)return;
 sb.auth.onAuthStateChange((ev,session)=>{const u=session?session.user:null;if((u&&u.id)!==(S.user&&S.user.id)){S.user=u;loadMine().then(()=>render(true))}});
 try{await loadAll();alertMatches(S.lots,false)}catch(e){toast(errMsg(e),"red")}loadedAt=Date.now();
 setInterval(tick,1000);
 setInterval(async()=>{if(document.hidden)return;await loadLots();if(S.admin)await loadAdmin();if(isSeller())await loadSellerData();softRender()},60000);
 document.addEventListener("visibilitychange",async()=>{if(!document.hidden){try{const {data}=await sb.rpc("server_time");if(data)SKEW=new Date(data).getTime()-Date.now()}catch(e){}await loadLots();softRender()}});
}
init();

</script>
</body>
</html>
